- id: 1
  feature: 登录
  story: 登录成功
  title: 管理员登录成功
  requires: []

  method: post
  path: /login
  headers: null
  params: null

  data:
    username: admin
    password: "123456"

  json: null
  files: null

  assertions:
    - type: status_code
      operator: equals
      expected: 200

    - type: json
      path: "$..msg"
      operator: equals
      expected: 登录成功

    - type: database
      sql: 'select mg_name from sp_manager where mg_name = "admin"'
      operator: equals
      expected: admin

  jsonExData:
    TOKEN: "$..token"

  sqlExData:
    ADMIN_NAME: 'select mg_name from sp_manager where mg_name = "admin"'

  is_true: true

